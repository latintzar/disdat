<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dis Dat — enable microphone</title>
<style>
:root{--bg:#FBF7EE;--ink:#16110D;--soft:#6b5d44;--line:rgba(28,18,6,.12);--acc:#FF5C2A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Inter,system-ui,sans-serif;line-height:1.6;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{max-width:480px;padding:40px 32px;text-align:center}
.kick{font:600 12px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
h1{font-size:26px;line-height:1.12;letter-spacing:-.02em;margin:12px 0 8px;font-weight:800}
p{color:var(--soft);font-size:15px;margin:0 0 22px}
button{background:var(--acc);color:#fff;border:none;border-radius:11px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer}
.ok{color:#1f7a3d;font-weight:700;font-size:16px;margin-top:18px}
.err{color:#b8431f;font-size:14px;margin-top:14px}
</style></head>
<body><div class="card">
  <div class="kick">Dis Dat · one-time</div>
  <h1>Enable the microphone</h1>
  <p>Dis Dat records your narration in the background so it keeps capturing even when you navigate to other pages. Grant mic access once — it persists for the extension.</p>
  <button id="go">Allow microphone</button>
  <div id="msg"></div>
</div>
<script src="request-mic.js"></script>
</body></html>
