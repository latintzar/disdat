name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Python and offline MCP tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Runtime tests
        run: node --test tests/runtime.test.cjs tests/local-inference.test.cjs tests/website.test.mjs
      - name: Reproduce extension download
        run: python3 tools/package-extension.py --output "$RUNNER_TEMP/disdat-extension.zip"
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Typecheck website
        working-directory: website
        run: npx tsc --noEmit

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: python -m pip install playwright==1.58.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser privacy test
        run: python3 tests/browser_extension.py
